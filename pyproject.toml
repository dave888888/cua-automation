[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cua-capabilities"
version = "0.1.0"
description = "Record-once / replay-many computer-use capabilities for legacy back-office apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "pydantic>=2.6",
  "pyyaml>=6",
  "starlette>=0.37",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pillow>=10",
  "packaging>=23",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cua = "cua.cli:main"

[tool.setuptools]
packages = ["cua", "cua.schema", "cua.surface", "cua.replay", "cua.discovery", "cua.handoff", "mockbank"]

[tool.setuptools.package-data]
"cua.surface" = ["scan.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
